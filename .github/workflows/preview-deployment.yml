name: Preview Deployment

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  deployments: write
  pull-requests: read
  checks: read

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Associate Cloudflare preview with GitHub deployment
        uses: actions/github-script@v7
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ACTION: ${{ github.event.action }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = process.env.HEAD_SHA;
            const branch = process.env.BRANCH;
            const prNumber = Number(process.env.PR_NUMBER);
            const action = process.env.ACTION;
            const environment = 'preview';
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            async function existingDeployments() {
              const { data } = await github.rest.repos.listDeployments({
                owner,
                repo,
                environment,
                per_page: 100,
              });
              return data;
            }

            if (action === 'closed') {
              for (const deployment of (await existingDeployments()).filter((item) => item.ref === sha)) {
                await github.rest.repos.createDeploymentStatus({
                  owner,
                  repo,
                  deployment_id: deployment.id,
                  state: 'inactive',
                  environment,
                  description: 'Preview PR closed',
                });
              }
              core.info(`Marked preview deployments inactive for ${sha}`);
              return;
            }

            let check = null;
            for (let attempt = 0; attempt < 40; attempt += 1) {
              const { data } = await github.rest.checks.listForRef({ owner, repo, ref: sha, per_page: 100 });
              check = data.check_runs.find((item) => item.name.startsWith('Workers Builds'));
              if (check && check.status === 'completed') break;
              await sleep(15000);
            }
            if (!check || check.status !== 'completed') {
              core.setFailed('Cloudflare Workers Builds check did not complete');
              return;
            }
            if (check.conclusion !== 'success') {
              core.setFailed(`Cloudflare Workers Builds failed: ${check.conclusion}`);
              return;
            }

            function urlFromComment(body) {
              const rows = body.split('</tr>');
              for (const row of rows) {
                if (!row.includes(sha)) continue;
                const match = row.match(/https:\/\/[a-z0-9-]+\.agungpradnya7\.workers\.dev/);
                if (match) return match[0];
              }
              return null;
            }

            let previewUrl = null;
            for (let attempt = 0; attempt < 40; attempt += 1) {
              const { data: comments } = await github.rest.issues.listComments({
                owner,
                repo,
                issue_number: prNumber,
                per_page: 100,
              });
              for (const comment of comments.slice().reverse()) {
                if (!comment.body.includes('Deploying Preview to Cloudflare')) continue;
                previewUrl = urlFromComment(comment.body);
                if (previewUrl) break;
              }
              if (previewUrl) break;
              await sleep(15000);
            }

            if (!previewUrl) {
              const slug = branch.replace(/[^a-zA-Z0-9-]/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');
              previewUrl = `https://${slug}-kampanye-politik-website-prototype.agungpradnya7.workers.dev`;
            }

            async function ok(path, marker) {
              const response = await fetch(new URL(path, previewUrl), { redirect: 'follow' });
              if (!response.ok) return false;
              if (!marker) return true;
              return (await response.text()).includes(marker);
            }

            const healthy = await ok('/', 'Kabinet Merah Putih')
              && await ok('/program/', 'Program Nasional')
              && await ok('/fonts/geist-serif/GeistSerifVF.woff2');
            if (!healthy) {
              core.setFailed(`Preview URL did not serve expected content: ${previewUrl}`);
              return;
            }

            let deployment = (await existingDeployments()).find((item) => item.ref === sha);
            if (!deployment) {
              const created = await github.rest.repos.createDeployment({
                owner,
                repo,
                ref: sha,
                task: 'preview-deployment',
                auto_merge: false,
                required_contexts: [],
                environment,
                transient_environment: true,
                production_environment: false,
                payload: {
                  branch,
                  pr_number: prNumber,
                  provider: 'cloudflare-workers-builds',
                },
              });
              deployment = created.data;
            }

            const { data: statuses } = await github.rest.repos.listDeploymentStatuses({
              owner,
              repo,
              deployment_id: deployment.id,
              per_page: 100,
            });
            const alreadySuccess = statuses.some(
              (status) => status.state === 'success' && status.environment_url === previewUrl,
            );
            if (!alreadySuccess) {
              await github.rest.repos.createDeploymentStatus({
                owner,
                repo,
                deployment_id: deployment.id,
                state: 'success',
                environment,
                environment_url: previewUrl,
                description: 'Cloudflare Workers preview verified',
                auto_inactive: true,
              });
            }
            core.info(`Preview deployment recorded for ${branch}@${sha}: ${previewUrl}`);
